name: phpunit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  XDEBUG_MODE: debug,coverage

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: [ '8.4', '8.5']

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: gd, iconv, imagick, mbstring, zlib

    - name: Install poppler-utils and ghostscript
      run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript

    - name: Allow ImageMagick to read PDFs
      # Ubuntu's ImageMagick ships a security policy that blocks the PDF
      # coder by default (the "ImageTragick" CVE-2016-3714 mitigation) -
      # without this, Imagick::readImage()/pingImage() fail on any PDF.
      run: |
        for policy in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
          if [ -f "$policy" ]; then
            sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' "$policy"
          fi
        done

    #- name: Validate composer.json and composer.lock
    #  run: composer validate

    - name: Get Composer cache directory
      id: composer-cache-dir
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer downloads
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-suggest

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    - name: Run test suite
      run: composer run-script test

    - name: Run analyse suite
      run: composer run-script analyse
